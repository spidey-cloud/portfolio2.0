  <!-- Prevent zoom out below 100% -->
  <script>
    (function () {
      // 1. Detect base device pixel ratio (100% zoom level)
      var baseDPR = parseFloat(sessionStorage.getItem('app-base-dpr') || '0');
      if (!baseDPR || baseDPR <= 0) {
        baseDPR = window.devicePixelRatio || 1;
        try {
          sessionStorage.setItem('app-base-dpr', String(baseDPR));
        } catch (_) {}
      }

      function enforceMinZoom() {
        var currentDPR = window.devicePixelRatio || 1;
        // If zoom drops below 100%, compensate with CSS zoom so content never shrinks below 100%
        if (currentDPR < baseDPR - 0.01) {
          var scale = (baseDPR / currentDPR);
          document.documentElement.style.zoom = scale;
        } else {
          document.documentElement.style.zoom = '1';
        }
      }

      // 2. Intercept keyboard shortcuts (Ctrl/Cmd + Minus / NumpadSubtract)
      window.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && (
          e.key === '-' || e.key === '_' ||
          e.code === 'NumpadSubtract' ||
          e.keyCode === 189 || e.keyCode === 109
        )) {
          var currentDPR = window.devicePixelRatio || 1;
          if (currentDPR <= baseDPR + 0.01) {
            e.preventDefault();
          }
        }
      }, { passive: false });

      // 3. Intercept Ctrl + MouseWheel / trackpad pinch-zoom out
      window.addEventListener('wheel', function (e) {
        if (e.ctrlKey && e.deltaY > 0) {
          var currentDPR = window.devicePixelRatio || 1;
          if (currentDPR <= baseDPR + 0.01) {
            e.preventDefault();
          }
        }
      }, { passive: false });

      // 4. Intercept touch pinch gestures below 100%
      document.addEventListener('gesturestart', function (e) {
        if (e.scale < 1) e.preventDefault();
      }, { passive: false });

      document.addEventListener('gesturechange', function (e) {
        if (e.scale < 1) e.preventDefault();
      }, { passive: false });

      // 5. Watch for resize/zoom changes
      window.addEventListener('resize', enforceMinZoom);
      enforceMinZoom();
    })();
  </script>

  <!-- Theme init: runs synchronously before render to prevent flash -->
  <script>
    (function () {
      var saved = localStorage.getItem('portfolio-theme');
      // Default to light if no preference has ever been saved
      if (!saved) {
        localStorage.setItem('portfolio-theme', 'light');
        saved = 'light';
      }
      if (saved === 'light') {
        document.documentElement.classList.add('light-theme');
      }
    })();
  </script>
